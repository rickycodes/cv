name: Publish CV PDF

on:
  push:
    branches:
      - main
    paths:
      - "cv.md"
      - "generate-cv.py"
      - "build-cv.sh"
      - ".github/workflows/publish-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cv
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CV
        uses: actions/checkout@v5

      - name: Setup LaTeX
        id: setup-texlive
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: "2022"
          packages: >-
            scheme-basic collection-latexextra plex fontaxes mweights

      - name: Report LaTeX cache
        run: |
          echo "TeX Live cache hit: ${{ steps.setup-texlive.outputs.cache-hit }}"
          echo "TeX Live version: ${{ steps.setup-texlive.outputs.version }}"

      - name: Build PDF
        run: ./build-cv.sh

      - name: Checkout website
        uses: actions/checkout@v5
        with:
          repository: rickycodes/www
          token: ${{ secrets.WWW_REPO_TOKEN }}
          path: www

      - name: Publish PDF
        run: |
          cp ricky-miller-cv.pdf www/static/cv.pdf
          cd www
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/cv.pdf
          if git diff --cached --quiet; then
            echo "CV PDF is unchanged."
            exit 0
          fi
          git commit -m "chore: update CV PDF"
          git push
